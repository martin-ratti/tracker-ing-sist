name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias del monorepo
        run: pnpm install --frozen-lockfile

      - name: Compilar backend y frontend
        run: pnpm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: 'tracker-isi-utn-6f213.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'tracker-isi-utn-6f213'
          VITE_FIREBASE_STORAGE_BUCKET: 'tracker-isi-utn-6f213.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '155271149492'
          VITE_FIREBASE_APP_ID: '1:155271149492:web:7a547c34e36dc81e7824e1'
          VITE_FIREBASE_MEASUREMENT_ID: 'G-N85G9T5JNH'

      - name: Desplegar canal de preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRACKER_ISI_UTN_6F213 }}'
          projectId: tracker-isi-utn-6f213
