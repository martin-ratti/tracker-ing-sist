<!doctype html>
<html lang="es" class="dark" data-theme="frost" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        if (window.location.hostname === 'tracker-isi-frro.web.app' || window.location.hostname === 'tracker-isi-utn-6f213.web.app' || window.location.hostname === 'tracker-isi-utn-6f213.firebaseapp.com') {
          window.location.replace('https://utn-sistemas-frro.web.app' + window.location.pathname + window.location.search + window.location.hash);
        }
        var savedMode = localStorage.getItem('utn_tracker_colormode');
        var mode = savedMode === 'light' || savedMode === 'dark' ? savedMode : 'dark';
        var savedTheme = localStorage.getItem('utn_tracker_theme');
        var theme = savedTheme && /^(cyber|synthwave|matrix|sunset|frost)$/.test(savedTheme) ? savedTheme : 'frost';
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-mode', mode);
        root.classList.toggle('dark', mode === 'dark');
        var csMeta = document.querySelector('meta[name="color-scheme"]');
        if (csMeta) csMeta.setAttribute('content', mode);
      } catch (e) {}
    </script>
