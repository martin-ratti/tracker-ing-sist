<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de Fondo Oscuro Tecnológico -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="50%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Borde con Brillo Gradiente Cian/Esmeralda -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Gradiente Tipográfico ISI -->
    <linearGradient id="isiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Gradiente de Barra de Progreso Tricolor (Aprobada / Regular / Cursable) -->
    <linearGradient id="statusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Filtro de Resplandor Neón -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Contenedor Base Estilo App Icon (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Nodos y Conexiones de Red (Grafo de Correlatividades) -->
  <path d="M 16 16 L 32 10 L 48 16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2.5 2" stroke-opacity="0.45" />
  <path d="M 16 16 L 32 23 L 48 16" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />

  <!-- Nodos de Estado Académico: Aprobada (Verde), Cursable (Cian), Regular (Ámbar) -->
  <circle cx="16" cy="16" r="3.5" fill="#10b981" filter="url(#neonGlow)" />
  <circle cx="32" cy="10" r="4.2" fill="#00f5ff" filter="url(#neonGlow)" />
  <circle cx="48" cy="16" r="3.5" fill="#f59e0b" filter="url(#neonGlow)" />

  <!-- Tipografía Central "ISI" (Ingeniería en Sistemas de Información) -->
  <text 
    x="32" 
    y="42" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="22" 
    font-weight="900" 
    letter-spacing="0.5px" 
    fill="url(#isiGrad)"
  >ISI</text>

  <!-- Barra de Avance y Titulación Inferior -->
  <rect x="17" y="49" width="30" height="3" rx="1.5" fill="url(#statusGrad)" filter="url(#neonGlow)" />
</svg>