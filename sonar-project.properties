# SonarQube / SonarCloud Project Configuration
sonar.projectKey=martin-ratti_tracker-ing-sist
sonar.organization=martin-ratti

# Definicion de fuentes y tests
sonar.sources=frontend/src,backend/src
sonar.tests=frontend/src/test,backend/src/test,e2e

# Exclusiones de analisis estatico
sonar.exclusions=frontend/src/test/**,backend/src/test/**,e2e/**,docs/**,.agents/**,.github/**,dist/**,node_modules/**

# Inclusiones para suite de tests
sonar.test.inclusions=frontend/src/test/**,backend/src/test/**,e2e/**

# Inclusion de reportes de cobertura LCOV para SonarQube / SonarCloud
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# Exclusion de deteccion de duplicaciones (CPD) para calendarios generados, tipos y tests
sonar.cpd.exclusions=frontend/src/data/calendario/anios/**,frontend/src/types/**,backend/src/types/**,frontend/src/data/**,backend/src/data/**,frontend/src/test/**,backend/src/test/**,e2e/**

# Ignorar regla de Browser Storage Poisoning en servicio de almacenamiento sanitizado
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=tssecurity:S8475
sonar.issue.ignore.multicriteria.e1.resourceKey=frontend/src/services/api.ts
